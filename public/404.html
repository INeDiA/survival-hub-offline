<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>BugOut Manager</title>
    <script>
      // SPA redirect for GitHub Pages — encodes the path into a query string
      // so GitHub's 404 becomes a redirect to index.html which restores the URL.
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.host +
          l.pathname
            .split("/")
            .slice(0, 2) // keep /survival-hub-offline/
            .join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(1).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
